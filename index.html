    <script>
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if window already sealed
        }
      })();
    </script>
